name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzip if the repo contains a zip)
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            mkdir -p /tmp/proj
            unzip -q -o "$(ls *.zip | head -n1)" -d /tmp/proj
            DIR=$(dirname "$(find /tmp/proj -name settings.gradle.kts | head -n1)")
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DarkKeyboard-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
